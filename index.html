<script>
"use strict";
/* ============================================================ preview gate */
function isPreview() {
  if (new URLSearchParams(location.search).get("_preview") === "1") return true;
  try {
    let w = window;
    while (w.parent && w.parent !== w) {
      w = w.parent;
      if (new URLSearchParams(w.location.search).get("_preview") === "1") return true;
    }
  } catch (e) { /* cross-origin ancestor: the climb ends here */ }
  return false;
}

/* ============================================================ helpers */
const P = fused.params;
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (v, d) => { const n = parseFloat(v); return Number.isFinite(n) ? n : (d || 0); };
const r3 = v => Math.round(v * 1000) / 1000;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function gp(k, def) { const v = P.get(k); return v == null || v === "" ? def : v; }
function setp(k, v) { if ((P.get(k) || "") !== String(v)) P.set(k, String(v)); }
function py(file, params, opts) {
  const p = {};
  for (const k in params) p[k] = typeof params[k] === "string" ? params[k] : (typeof params[k] === "object" ? JSON.stringify(params[k]) : String(params[k]));
  return fused.runPython(file, p, Object.assign({ key: null }, opts || {}));
}

let LIST = null, FONTS = {}, DOC = null, DOC_SLUG = "", DIRTY = false, BUILT = "";
let openTok = 0, writeQ = Promise.resolve(), draftTimer = 0, panelSig = "", sideSig = "", thumbVer = 0;
let uid = 0, failedSlug = "";

function url(p) {
  if (!p) return "";
  const u = fused.rawUrl(p);
  return BUILT ? u + (u.indexOf("?") >= 0 ? "&" : "?") + "b=" + BUILT : u;
}
function queue(fn) { const run = writeQ.then(fn, fn); writeQ = run.catch(() => {}); return run; }

let toastTimer = 0;
function toast(html, opts) {
  const t = $("#toast");
  t.innerHTML = html;
  t.className = opts && opts.err ? "err" : "";
  t.hidden = false;
  clearTimeout(toastTimer);
  if (!(opts && opts.sticky)) toastTimer = setTimeout(() => { t.hidden = true; }, (opts && opts.ms) || 3200);
}
function errMsg(e) { return esc((e && (e.message || e.type)) || String(e)); }

/* ============================================================ fonts + text measurement */
function installFonts(list) {
  const css = list.map(f => `@font-face{font-family:"pr-${f.id}";src:${f.local.map(n => `local("${n}")`).join(",")};}`).join("\n");
  const st = document.createElement("style");
  st.textContent = css;
  document.head.appendChild(st);
  FONTS = {};
  for (const f of list) FONTS[f.id] = f;
}
function fam(id) { const f = FONTS[id] || FONTS["hn-medium"]; return f ? `"pr-${f.id}", ${f.fallback}` : "sans-serif"; }
async function loadFonts() {
  await Promise.all(Object.keys(FONTS).map(id => document.fonts.load(`40px "pr-${id}"`).catch(() => null)));
}
const mctx = document.createElement("canvas").getContext("2d");
const inkCache = new Map();
function inkBox(lines, fid, ref, lh, tr) {
  const k = [fid, lines.join("\n"), lh, tr].join("|");
  if (inkCache.has(k)) return inkCache.get(k);
  mctx.font = `${ref}px ${fam(fid)}`;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  lines.forEach((ln, i) => {
    if (!ln.trim()) return;
    const m = mctx.measureText(ln);
    const base = (i * lh + lh / 2 + 0.35) * ref;
    x0 = Math.min(x0, -m.actualBoundingBoxLeft);
    x1 = Math.max(x1, m.actualBoundingBoxRight + tr * ref * (ln.length - 1));
    y0 = Math.min(y0, base - m.actualBoundingBoxAscent);
    y1 = Math.max(y1, base + m.actualBoundingBoxDescent);
  });
  const box = x1 > x0 && y1 > y0 ? { x0, y0, x1, y1 } : { x0: 0, y0: 0, x1: ref, y1: ref };
  inkCache.set(k, box);
  return box;
}

/* ============================================================ layer rendering (mirrors pinlib/render.py) */
function sortedLayers(d) {
  return d.layers.map((L, i) => [L, i]).sort((a, b) => (num(a[0].z, a[1]) - num(b[0].z, b[1])) || (a[1] - b[1])).map(a => a[0]);
}
function cssFilter(L) {
  const f = [];
  if (L.filter === "bw" || L.filter === "sketch") f.push("grayscale(1)");
  const c = num(L.contrast, 1), b = num(L.brightness, 1);

    const th = num(L0.rotation) * Math.PI / 180, cos = Math.cos(th), sin = Math.sin(th);
    const w0 = num(L0.w) / 100 * W, h0 = num(L0.h) / 100 * H;
    const c0x = num(L0.x) / 100 * W + w0 / 2, c0y = num(L0.y) / 100 * H + h0 / 2;
    const dxl = dx * cos + dy * sin, dyl = -dx * sin + dy * cos;
    let w = w0 + hx * dxl, h = h0 + hy * dyl;
    if (hx && hy && !ev.shiftKey) { const s = Math.max(w / w0, h / h0); w = w0 * s; h = h0 * s; }
    w = Math.max(w, 4); h = Math.max(h, 4);
    const ax = -hx * w0 / 2, ay = -hy * h0 / 2;
    const awx = c0x + ax * cos - ay * sin, awy = c0y + ax * sin + ay * cos;
    const ox = hx * w / 2, oy = hy * h / 2;
    const cx = awx + ox * cos - oy * sin, cy = awy + ox * sin + oy * cos;
    L.x = r3((cx - w / 2) / W * 100); L.y = r3((cy - h / 2) / H * 100);
    L.w = r3(w / W * 100); L.h = r3(h / H * 100);
    if (L.kind === "text" && L.fit !== "stretch" && hx && hy) L.size = r3(num(L0.size, 4) * h / h0);
  }
  paintPoster(MAIN.poster, DOC);
  paintSelection();
}
function onUp(ev) {
  if (!drag) return;
  try { MAIN.frame.releasePointerCapture(ev.pointerId); } catch (e) { /* already released */ }
  const moved = drag.moved;
  drag = null;
  if (moved) { markDirty(); panelSig = ""; renderPanel(); }
}

function setPath(obj, path, val) {
  const ks = path.split(".");

  for (let i = 0; i < ks.length - 1; i++) { if (typeof o[ks[i]] !== "object" || o[ks[i]] == null) o[ks[i]] = {}; o = o[ks[i]]; }
  o[ks[ks.length - 1]] = val;
}
function wirePanel(body) {
  body.querySelectorAll("[data-open]").forEach(b => b.onclick = () => setp("d", b.dataset.open));
  const rb = body.querySelector('[data-act="rebuild"]');
  if (rb) rb.onclick = rebuildAll;
  body.querySelectorAll("[data-k]").forEach(el => {
    const handler = ev => {
      const k = el.dataset.k, t = el.dataset.t;
      let v = el.value;
      if (t === "num") { if (v === "" || !Number.isFinite(parseFloat(v))) return; v = parseFloat(v); }
      if (t === "color" && !/^#[0-9a-f]{6}$/i.test(v)) return;
      const out = el.parentElement.querySelector("output");
      if (out) out.textContent = r3(v);
      if (t === "color") { const twin = el.parentElement.querySelectorAll("[data-k]"); twin.forEach(o => { if (o !== el) o.value = v; }); }
      if (k.startsWith("canvas.")) { DOC.canvas[k.slice(7)] = v; edit(() => {}); return; }
      if (k === "filter") { applyFilter(v); return; }
      const structural = ["fit", "effect", "name", "font"].includes(k) && ev.type === "change";
      edit(L => { if (L) setPath(L, k, v); }, { panel: structural && k !== "name" });
      if (k === "name") { const row = body.querySelector(`.lr[data-id="${CSS.escape(gp("sel", ""))}"] .ln`); if (row) row.textContent = v; }
    };
    const isSel = el.tagName === "SELECT";
    el.addEventListener(isSel ? "change" : "input", handler);
  });
  const list = body.querySelector("#layerList");
  if (!list) return;
  list.querySelectorAll(".lr").forEach(row => {
    const id = row.dataset.id;
    row.addEventListener("click", ev => {
      const b = ev.target.closest("[data-act]");
      const L = DOC.layers.find(x => x.id === id);
      if (b && L) {
        if (b.dataset.act === "eye") L.visible = L.visible === false;
        else L.locked = !L.locked;
        panelSig = "";
        edit(() => {}, { panel: true });
        return;
      }
      setp("sel", gp("sel", "") === id ? "" : id);
    });
    row.addEventListener("dragstart", ev => { ev.dataTransfer.setData("text/plain", id); ev.dataTransfer.effectAllowed = "move"; row.style.opacity = ".5"; });
    row.addEventListener("dragend", () => { row.style.opacity = ""; });
    row.addEventListener("dragover", ev => {
      ev.preventDefault();
      const r = row.getBoundingClientRect();
      const below = ev.clientY > r.top + r.height / 2;
      row.classList.toggle("dropb", below); row.classList.toggle("dropt", !below);
    });

    row.addEventListener("drop", ev => {
      ev.preventDefault();
      const below = row.classList.contains("dropb");
      row.classList.remove("dropb", "dropt");
      const from = ev.dataTransfer.getData("text/plain");
      if (!from || from === id) return;
      reorder(from, id, below);

}
function reorder(fromId, targetId, below) {
  const top = sortedLayers(DOC).reverse();
  const moving = top.find(L => L.id === fromId);
  const rest = top.filter(L => L.id !== fromId);
  let i = rest.findIndex(L => L.id === targetId);
  if (i < 0 || !moving) return;
  if (below) i += 1;
  rest.splice(i, 0, moving);
  const bottomUp = rest.reverse();
  bottomUp.forEach((L, k) => { L.z = k; });
  DOC.layers = bottomUp;
  panelSig = "";
  edit(() => {}, { panel: true });
}

/* ---------- filters + image swapping */
async function applyFilter(v) {
  const L = selLayer();
  if (!L) return;
  if (v === "sketch" && L.src === L.src_raw && L.swap !== "sketch" && L.src_raw) {
    toast('<span class="spin"></span> Sketching…', { sticky: true });
    try {
      const r = await py("sketch.py", { src: L.src_raw }, { key: "sketch" });
      L.src = r.png;
      toast("Sketch filter applied.");
    } catch (e) { toast("Sketch failed: " + errMsg(e), { err: true }); return; }
  } else if (v !== "sketch" && L.filter === "sketch" && L.src_raw && L.swap !== "sketch") {
    L.src = L.src_raw;
  }
  edit(() => { L.filter = v; }, { panel: true });
}
function resetImage() {
  edit(L => {
    L.src = L.src_orig; L.src_raw = L.src_orig; L.mask = L.mask_orig || "";
    L.fit = "fill"; L.crop = { x: 50, y: 50, scale: 1 };
  }, { panel: true });
}
async function applySwap(photoPath) {
  const id = gp("swap", "");
  const L = DOC && DOC.layers.find(x => x.id === id);
  if (!L) return;
  const W = num(DOC.canvas.width), H = num(DOC.canvas.height);
  const mode = L.swap || "mask";
  toast('<span class="spin"></span> Preparing the photo…', { sticky: true });
  try {
    if (mode === "cutout") {
      const r = await py("cutout.py", { src: photoPath, mode: "auto", bw: L.filter === "bw" ? "true" : "false" }, { key: "swap" });
      const cx = num(L.x) + num(L.w) / 2, bottom = num(L.y) + num(L.h);
      const h = num(L.h), w = h / 100 * H * (r.width / r.height) / W * 100;
      Object.assign(L, { src: r.png, src_raw: r.png, mask: "", fit: "fill", crop: { x: 50, y: 50, scale: 1 }, x: r3(cx - w / 2), y: r3(bottom - h), w: r3(w), h: r3(h) });
    } else if (mode === "sketch") {
      const r = await py("sketch.py", { src: photoPath }, { key: "swap" });
      const cx = num(L.x) + num(L.w) / 2, bottom = num(L.y) + num(L.h);
      const w = num(L.w), h = w / 100 * W / (r.width / r.height) / H * 100;
      Object.assign(L, { src: r.png, src_raw: r.raw, mask: "", fit: "fill", filter: "sketch", crop: { x: 50, y: 50, scale: 1 }, x: r3(cx - w / 2), y: r3(bottom - h), w: r3(w), h: r3(h) });
    } else {
      const r = await py("prepare_photo.py", { src: photoPath }, { key: "swap" });
      let src = r.path;
      if (L.filter === "sketch") src = (await py("sketch.py", { src: r.path }, { key: "swap" })).png;
      Object.assign(L, { src, src_raw: r.path, fit: "cover", crop: { x: 50, y: 50, scale: 1 } });
      if (mode === "free") L.mask = "";
    }
    $("#toast").hidden = true;
    P.set("swap", "");
    edit(() => {}, { panel: true });
  } catch (e) { toast("Swap failed: " + errMsg(e), { err: true }); }
}

/* ---------- swap browser (open state + folder live in the URL) */
let SW = { folder: "", photos: [], next: null, total: 0, loading: false, err: "" };
async function loadSwapFolder(folder, more) {
  if (more && SW.loading) return;
  if (!more) SW = { folder, photos: [], next: null, total: 0, loading: true, err: "" };
  else SW.loading = true;
  const mine = SW;
  paintSwapGrid();
  try {
    let r;
    for (let i = 0; i < 30; i++) {   // a big folder's first scan answers "indexing" until its date index is built
      r = await py("list_folder.py", { path: folder, offset: String(more ? mine.next : 0), count: "60" }, { key: "swapdir" });
      if (mine !== SW || r.status !== "indexing") break;
      $("#swapInfo").textContent = `Reading dates… ${r.indexed} of ${r.total}`;
    }
    if (mine !== SW) return;
    SW.photos = SW.photos.concat(r.photos); SW.next = r.next_offset; SW.total = r.total;
  } catch (e) {
    if (mine !== SW) return;
    SW.err = (e && e.message) || String(e);
  }
  SW.loading = false;
  paintSwapGrid();
}
function paintSwapGrid() {
  const g = $("#swapGrid");
  if (SW.err) g.innerHTML = `<div class="msg" style="grid-column:1/-1">${esc(SW.err)}</div>`;
  else if (!SW.photos.length) g.innerHTML = `<div class="msg" style="grid-column:1/-1">${SW.loading ? "Reading the folder… first look at a big folder makes thumbnails." : "No photos here."}</div>`;
  else g.innerHTML = SW.photos.map((p, i) => `<button class="ph" data-i="${i}" title="${esc(p.path)}"><div class="im"><img loading="lazy" alt="" src="${esc(url(p.thumb))}"></div><div class="m">#${p.n} · ${esc((p.date || "").slice(0, 10))}${p.place ? " · " + esc(p.place) : ""}</div></button>`).join("");
  g.querySelectorAll(".ph").forEach(b => b.onclick = () => applySwap(SW.photos[+b.dataset.i].path));
  $("#swapInfo").textContent = SW.loading ? "Loading…" : SW.total ? `${SW.photos.length} of ${SW.total} photos · ${SW.folder}` : "";
  $("#swapMore").hidden = SW.next == null || SW.loading;
}
function renderSwap() {
  const id = gp("swap", "");
  const L = id && DOC ? DOC.layers.find(x => x.id === id) : null;
  $("#swap").hidden = !L;
  if (!L) return;
  $("#swapTitle").textContent = `Swap image — ${L.name || L.id}`;
  const folder = gp("sdir", LIST.bali_dir || "");
  const di = $("#swapDir");
  if (document.activeElement !== di) di.value = folder;
  if (SW.folder !== folder) loadSwapFolder(folder, false);
}
function renderVariantDlg() {
  const open = gp("dlg", "") === "variant" && !!DOC;
  const dlg = $("#variantDlg"), wasHidden = dlg.hidden;
  dlg.hidden = !open;
  const v = $("#vname");
  if (open && document.activeElement !== v) v.value = gp("vname", DOC.name.replace(/ — .*$/, "") + " variant");
  if (open && wasHidden) setTimeout(() => { v.focus(); v.select(); }, 0);
}
async function rebuildAll() {
  if (!confirm("Rebuild every layer from the original pins and Bali photos? This overwrites the 6 shipped designs (your own variants stay).")) return;
  clearTimeout(draftTimer); draftTimer = 0;
  await writeQ;
  $("#app").hidden = true;
  try {
    await runSetup(true);
    await loadList();
    DOC_SLUG = ""; DOC = null; failedSlug = ""; alphaCache.clear(); inkCache.clear();
  } catch (e) { toast("Rebuild failed: " + errMsg(e), { err: true }); }
  $("#boot").hidden = true;
  $("#app").hidden = false;
  onParams();
}

/* ============================================================ static wiring */
function wireStatic() {
  $("#bSave").onclick = doSave;
  $("#bDiscard").onclick = doDiscard;
  $("#bRevert").onclick = doRevert;
  $("#bDup").onclick = () => doCopy("duplicate", "");
  $("#bExport").onclick = doExport;
  $("#bVariant").onclick = () => setp("dlg", gp("dlg", "") === "variant" ? "" : "variant");
  $("#vCancel").onclick = () => { P.set("dlg", ""); P.set("vname", ""); };
  $("#vCreate").onclick = () => doCopy("save_as", $("#vname").value.trim() || (DOC ? DOC.name + " variant" : "variant"));
  $("#vname").addEventListener("input", ev => setp("vname", ev.target.value));
  $("#vname").addEventListener("keydown", ev => { if (ev.key === "Enter") $("#vCreate").click(); });
  for (const b of $("#cmpSeg").children) b.onclick = () => setp("cmp", b.dataset.v);
  $("#co").addEventListener("input", ev => setp("co", ev.target.value));
  $("#swapClose").onclick = () => P.set("swap", "");
  $("#swap").addEventListener("pointerdown", ev => { if (ev.target.id === "swap") P.set("swap", ""); });
  $("#swapLoad").onclick = () => setp("sdir", $("#swapDir").value.trim());
  $("#swapDir").addEventListener("keydown", ev => { if (ev.key === "Enter") $("#swapLoad").click(); });
  $("#swapBali").onclick = () => setp("sdir", LIST.bali_dir || "");
  $("#swapMore").onclick = () => loadSwapFolder(SW.folder, true);
  $("#swapPick").onclick = () => $("#filePick").click();
  $("#filePick").addEventListener("change", ev => {
    const f = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!f) return;
    const rd = new FileReader();
    rd.onload = async () => {
      toast('<span class="spin"></span> Importing ' + esc(f.name) + "…", { sticky: true });
      try {
        const r = await py("import_file.py", { name: f.name, data: String(rd.result) }, { key: "import" });
        await applySwap(r.path);
      } catch (e) { toast("Import failed: " + errMsg(e), { err: true }); }
    };
    rd.readAsDataURL(f);
  });
  MAIN.frame.addEventListener("pointerdown", onDown);
  MAIN.frame.addEventListener("pointermove", onMove);
  MAIN.frame.addEventListener("pointerup", onUp);
  MAIN.frame.addEventListener("pointercancel", onUp);
  $("#panelBody").addEventListener("click", ev => {
    const b = ev.target.closest("[data-act]");
    if (!b || b.closest(".lr")) return;
    if (b.dataset.act === "swap") setp("swap", gp("sel", ""));
    else if (b.dataset.act === "resetimg") resetImage();
  });
  window.addEventListener("keydown", ev => {
    const tag = (ev.target.tagName || "").toLowerCase();
    const typing = tag === "input" || tag === "textarea" || tag === "select";
    if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "s") { ev.preventDefault(); doSave(); return; }
    if (ev.key === "Escape") {
      if (gp("swap", "")) P.set("swap", "");
      else if (gp("dlg", "")) P.set("dlg", "");
      else if (!typing && gp("sel", "")) P.set("sel", "");
      return;
    }
    if (typing) return;
    const L = selLayer();
    const step = ev.shiftKey ? 1 : 0.1;
    const mv = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[ev.key];
    if (mv && L && !L.locked) {
      ev.preventDefault();
      edit(x => { x.x = r3(num(x.x) + mv[0]); x.y = r3(num(x.y) + mv[1]); });
      clearTimeout(window._nudge);
      window._nudge = setTimeout(() => { panelSig = ""; renderPanel(); }, 400);
    }
  });
  window.addEventListener("beforeunload", () => { if (draftTimer) saveDraft(); });
}

boot();
</script>
</body>
